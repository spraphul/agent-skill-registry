[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-registry"
version = "0.1.0"
description = "CLI and registry metadata for installing agent skills across Codex and Claude."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agent-skill-registry contributors" }]
keywords = ["agents", "skills", "codex", "claude", "registry"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
agent-skill = "agent_skill_registry.cli:main"

[tool.setuptools.packages.find]
include = ["agent_skill_registry*"]
